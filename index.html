
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumble Player</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    #rumble_v7fsc56 {
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
    }

    #rumble_v7fsc56 iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }
  </style>
</head>

<body>

<h2>Rumble Video Player</h2>

<div id="rumble_v7fsc56"></div>

<script>
window.Rumble = function(action, opts) {
  if (action === "play" && opts && opts.video && opts.div) {

    function injectIframe() {
      const target = document.getElementById(opts.div);

      if (target && !target.querySelector("iframe")) {
        const iframe = document.createElement("iframe");

        iframe.src =
          "https://rumble.com/embed/" +
          encodeURIComponent(opts.video) +
          "/?pub=u4qx28w";

        iframe.setAttribute("frameborder", "0");
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute(
          "allow",
          "autoplay; fullscreen; picture-in-picture"
        );

        target.appendChild(iframe);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener(
        "DOMContentLoaded",
        injectIframe,
        { once: true }
      );
    } else {
      injectIframe();
    }
  }
};

Rumble("play", {
  video: "v7fsc56",
  div: "rumble_v7fsc56"
});
</script>

</body>
</html>
